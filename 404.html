<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — Çalışmalar Fihristi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EEE0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F4EEE0'/%3E%3Ccircle cx='22' cy='24' r='11' fill='%232B4E8F'/%3E%3Cpolygon points='43,13 54,35 32,35' fill='%23B7392A'/%3E%3Crect x='18' y='40' width='20' height='11' fill='%23DFA71C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4EEE0;--paper2:#EBE3D1;--ink:#1C1916;--rule:#C8BBA1;--muted:#6C6151;--red:#B7392A;--blue:#2B4E8F;--yellow:#DFA71C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  font-family:"EB Garamond",Garamond,Georgia,serif;font-size:18px;line-height:1.55;padding:40px 24px}
main{max-width:520px;text-align:center}
.sc{font-variant:all-small-caps;letter-spacing:.15em}
.top{font-size:.82rem;color:var(--muted);margin:0 0 18px}
svg{display:block;margin:0 auto 26px;width:180px;height:auto}
h1{font-weight:500;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;margin:0 0 .35em}
h1 .r{color:var(--red)}
p{margin:0 0 14px;color:#3A342B}
a{color:inherit}
.go{margin-top:28px;font-size:.9rem}
.go a{margin:0 .6em;text-decoration:none;border-bottom:1.5px solid var(--red)}
.go a:hover{border-bottom-color:var(--ink)}
code{font-size:.84rem;background:var(--paper2);border:1px solid var(--rule);padding:1px 6px}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="top sc">Çalışmalar Fihristi · Hakan Ataş</p>
  <svg viewBox="0 0 180 112" role="img" aria-label="boş levha süslemesi">
    <rect x=".5" y=".5" width="179" height="111" fill="var(--paper2)" stroke="var(--ink)"/>
    <circle cx="66" cy="56" r="30" fill="var(--blue)"/>
    <circle cx="96" cy="56" r="30" fill="none" stroke="var(--ink)" stroke-width="1.3"/>
    <polygon points="126,32 150,76 102,76" fill="none" stroke="var(--red)" stroke-width="1.3"/>
    <rect x="30" y="80" width="16" height="16" fill="var(--yellow)"/>
  </svg>
  <h1>Boş <span class="r">levha</span></h1>
  <p>Aradığın sayfa bu fihristte yok. Adres değişmiş ya da depo yeniden adlandırılmış olabilir.</p>
  <p id="hint" hidden>Belki şunu arıyordun: <a id="guess" href="./"></a></p>
  <p class="go sc"><a href="./">fihriste dön</a><a href="https://github.com/hakanatas" target="_blank" rel="noopener">github.com/hakanatas</a></p>
</main>
<script>
/* Adresteki parçadan depo adını çıkarıp fihristte arama bağlantısı öner */
(function(){
  var parts=location.pathname.replace(/^\/github-calismalar\/?/,"").split("/").filter(Boolean);
  if(!parts.length) return;
  var slug=parts[0].replace(/\.html?$/,"");
  var a=document.getElementById("guess");
  a.href="./#ara="+encodeURIComponent(slug); a.textContent="“"+slug+"” için fihristte ara";
  document.getElementById("hint").hidden=false;
})();
</script>
</body>
</html>
